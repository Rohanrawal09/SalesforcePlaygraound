<template>

    <!-- Loading Spinner -->
    <template if:true={isLoading}>
        <lightning-spinner
            alternative-text="Loading"
            size="medium">
        </lightning-spinner>
    </template>

    <lightning-card title="Sticky Notes" icon-name="utility:note">

        <!-- ========================= -->
        <!-- Create / Edit Form -->
        <!-- ========================= -->

        <div class="slds-p-around_medium">

            <lightning-input
                label="Title"
                value={title}
                onchange={handleTitleChange}
                required>
            </lightning-input>

            <lightning-textarea
                class="slds-m-top_small"
                label="Description"
                value={description}
                onchange={handleDescriptionChange}>
            </lightning-textarea>

            <lightning-combobox
                class="slds-m-top_small"
                label="Priority"
                value={priority}
                options={priorityOptions}
                onchange={handlePriorityChange}>
            </lightning-combobox>

            <lightning-combobox
                class="slds-m-top_small"
                label="Category"
                value={category}
                options={categoryOptions}
                onchange={handleCategoryChange}>
            </lightning-combobox>

            <lightning-combobox
                class="slds-m-top_small"
                label="Color"
                value={color}
                options={colorOptions}
                onchange={handleColorChange}>
            </lightning-combobox>

            <lightning-input
                class="slds-m-top_small"
                type="date"
                label="Reminder Date"
                value={reminderDate}
                onchange={handleReminderDateChange}>
            </lightning-input>

            <div class="slds-m-top_medium">

                <lightning-button
                    variant="brand"
                    label={saveButtonLabel}
                    onclick={handleSave}>
                </lightning-button>

                <template if:true={isEditMode}>
                    <lightning-button
                        class="slds-m-left_small"
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCancel}>
                    </lightning-button>
                </template>

            </div>

        </div>

        <!-- ========================= -->
        <!-- Notes List -->
        <!-- ========================= -->

        <template if:true={notes}>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">

                <template for:each={notes} for:item="note">

                    <article
                        key={note.Id}
                        class="slds-card slds-m-bottom_medium slds-p-around_medium">

                        <div class="slds-grid slds-grid_align-spread">

                            <div>

                                <h2 class="slds-text-heading_small">
                                    {note.Title__c}
                                </h2>

                                <p class="slds-m-top_x-small">
                                    {note.Description__c}
                                </p>

                                <div class="slds-m-top_small">

                                    <lightning-badge
                                        label={note.Priority__c}>
                                    </lightning-badge>

                                    <lightning-badge
                                        class="slds-m-left_x-small"
                                        label={note.Category__c}>
                                    </lightning-badge>

                                    <lightning-badge
                                        class="slds-m-left_x-small"
                                        label={note.Color__c}>
                                    </lightning-badge>

                                </div>

                                <template if:true={note.Reminder_Date__c}>
                                    <p class="slds-text-color_weak slds-m-top_small">
                                        Reminder:
                                        {note.Reminder_Date__c}
                                    </p>
                                </template>

                            </div>

                            <!-- Action Buttons -->

                            <div>

                                <lightning-button-icon
                                    icon-name="utility:edit"
                                    alternative-text="Edit"
                                    title="Edit"
                                    data-id={note.Id}
                                    onclick={handleEdit}>
                                </lightning-button-icon>

                                <lightning-button-icon
                                    class="slds-m-left_small"
                                    icon-name="utility:delete"
                                    alternative-text="Delete"
                                    title="Delete"
                                    variant="bare"
                                    data-id={note.Id}
                                    onclick={handleDelete}>
                                </lightning-button-icon>

                            </div>

                        </div>

                    </article>

                </template>

            </div>

        </template>

        <!-- ========================= -->
        <!-- Empty State -->
        <!-- ========================= -->

        <template if:false={notes.length}>

            <div class="slds-p-around_large slds-align_absolute-center">

                <p class="slds-text-heading_small slds-text-color_weak">
                    No Sticky Notes Found
                </p>

            </div>

        </template>

    </lightning-card>

</template>
