<template>
    <!-- ===== SECTION 1: Static Child Component ===== -->
    <!-- Displays static data passed from parent component -->
    <lightning-card title="Static Child Component">

        <!-- Display primitive data using data binding {propertyName} -->
        <p>Message: {messageFromParentToChild}</p>
        <p>User: {childUsernameFromParent}</p>

        <!-- 
            Conditional rendering: lwc:if checks if childAccountInfoFromParent object exists
            Prevents UI errors from accessing undefined object properties
            Only renders when data is available from parent
        -->
        <template lwc:if={childAccountInfoFromParent}>
            <p>Account Name: {childAccountInfoFromParent.name}</p>
            <p>Industry: {childAccountInfoFromParent.industry}</p>
            <p>Employees: {childAccountInfoFromParent.employees}</p>
        </template>

    </lightning-card>

    <!-- ===== SECTION 2: Declarative SOQL Results ===== -->
    <!-- Displays Account data from parent's SOQL query results -->
    <lightning-card title="SOQL Child Component">
        
        <!-- 
            for:each - Iterates over childSoqlAccountDetailFromParent array
            for:item="account" - Creates 'account' variable for each iteration
            Displays Account details from declarative SOQL query
        -->
        <template for:each={childSoqlAccountDetailFromParent} for:item="account">
            
            <!-- 
                key attribute - REQUIRED for list rendering in LWC
                Must be unique for each item in the loop
                Using account.Id ensures uniqueness for each Account record
            -->
            <div key={account.Id}>
                <p><strong>Account: {account.Name}</strong></p>
                <p>Industry: {account.Industry}</p>
                <p>Phone: {account.Phone}</p>
            </div>

        </template>

    </lightning-card>

    <!-- ===== SECTION 3: Imperative SOQL Results ===== -->
    <!-- Displays Lead data from parent's imperative SOQL query -->
    <lightning-card title="Imperatively SOQL Child Component">
        
        <!-- 
            for:each - Iterates over childSoqlLeadDetailImperativelyFromParent array
            for:item="lead" - Creates 'lead' variable for current item
            for:index="count" - Provides 0-based index for each iteration
        -->
        <template for:each={childSoqlLeadDetailImperativelyFromParent} for:item="lead" for:index="count">
    
            <!-- key attribute is required and must be unique -->
            <div key={lead.Id}>
                <p>Lead: {lead.Name}</p>
                <p>Company: {lead.Company}</p>
                <p>Status: {lead.Status}</p>
                <p>Index: {count}</p>
                <br/>
            </div>

        </template>

    </lightning-card>

    <!-- ===== SECTION 4: Parent-Child Communication ===== -->
    <!-- Demonstrates sending data from child component back to parent -->
    <lightning-card title="Send Data From Child To Parent">

        <!-- Button triggers event handler to send data to parent -->
        <lightning-button
            label="Send Data To Parent"
            onclick={childHandleClick}>
        </lightning-button>
        
    </lightning-card>

    <!-- Named slot for parent component content insertion -->
    <slot></slot>

</template>
