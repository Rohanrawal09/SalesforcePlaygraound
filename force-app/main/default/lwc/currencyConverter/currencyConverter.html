<template>
    <lightning-card title="Currency Converter" icon-name="standard:currency_input">
        <div class="slds-p-around_medium">
            <lightning-combobox
                label="From"
                value={fromCurrency}
                options={currencyOptions}
                onchange={handleFromChange}>
            </lightning-combobox>

            <lightning-combobox
                label="To"
                value={toCurrency}
                options={currencyOptions}
                onchange={handleToChange}
                class="slds-m-top_small">
            </lightning-combobox>

            <lightning-input
                type="number"
                label="Amount"
                value={amount}
                onchange={handleAmountChange}
                class="slds-m-top_small"
                formatter="currency">
            </lightning-input>

            <lightning-button
                variant="brand"
                label="Convert"
                onclick={handleConvert}
                class="slds-m-top_medium"
                disabled={isLoading}>
            </lightning-button>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Converting" size="small"></lightning-spinner>
            </template>

            <template if:true={hasResult}>
                <p class="slds-text-heading_medium slds-m-top_medium">
                    {amount} {fromCurrency} = {result} {toCurrency}
                </p>
            </template>

            <template if:true={hasError}>
                <p class="slds-text-color_error slds-m-top_medium">{errorMessage}</p>
            </template>
        </div>
    </lightning-card>
</template>
